<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="display:none">
<form id="sf" method="post" action="">
    {% csrf_token %}
    {% for field in form %}
    <input type="hidden" name="{{ field.html_name }}" value="{{ field.value }}">
    {% endfor %}
</form>
<script>document.getElementById('sf').submit();</script>
</body>
</html>
