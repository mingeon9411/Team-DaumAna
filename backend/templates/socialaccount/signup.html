<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="display:none">
<form id="sf" method="post" action="">
    {% csrf_token %}
    {% for field in form %}
    <input type="hidden" name="{{ field.html_name }}" value="{{ field.value }}">
    {% endfor %}
</form>
<script>
    if (!sessionStorage.getItem('social_signup_submitted')) {
        sessionStorage.setItem('social_signup_submitted', '1');
        document.getElementById('sf').submit();
    } else {
        sessionStorage.removeItem('social_signup_submitted');
        window.location.href = 'http://localhost:5173/login';
    }
</script>
</body>
</html>
