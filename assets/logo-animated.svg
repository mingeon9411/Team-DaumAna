<svg xmlns="http://www.w3.org/2000/svg" width="320" height="147" viewBox="0 0 396 185">
  <defs>
    <style>
      .logo {
        animation: fadeSlideIn 1s ease-out forwards, floating 4s ease-in-out 1s infinite;
        opacity: 0;
      }
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0px);  }
      }
      @keyframes floating {
        0%,  100% { transform: translateY(0px); }
        50%        { transform: translateY(-7px); }
      }
    </style>
  </defs>
  <rect x="0" y="0" width="396" height="185" rx="20" ry="20" fill="#FEF6EA"/>
  <image class="logo" x="15" y="15" width="366" height="155"
    href="data:image/png;base64,"/>
</svg>