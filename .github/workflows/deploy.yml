name: Build and Deploy (Frontend + Django)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 프론트는 컨테이너가 아니라, EC2 host nginx가 /var/www/jipdaum을 정적 서빙하는 기존 구조를 따른다.
  # (참고: /etc/nginx/sites-enabled/jipdaum 이 root /var/www/jipdaum; try_files ... /index.html; 로 되어있음)
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_SPRING_API_URL: ${{ secrets.VITE_SPRING_API_URL }}
          VITE_HCAPTCHA_SITE_KEY: ${{ secrets.VITE_HCAPTCHA_SITE_KEY }}
          VITE_PORTONE_STORE_ID: ${{ secrets.VITE_PORTONE_STORE_ID }}
          VITE_PORTONE_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_CHANNEL_KEY }}

      - name: Copy dist to EC2 (/var/www/jipdaum)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/jipdaum"
          strip_components: 2
          overwrite: true

  build-django:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mingeon9411
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            mingeon9411/jipdaum-django:latest
            mingeon9411/jipdaum-django:${{ github.sha }}
          cache-from: type=gha,scope=django
          cache-to: type=gha,mode=max,scope=django

  deploy-django:
    needs: build-django
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull mingeon9411/jipdaum-django:latest
            docker stop jipdaum-django || true
            docker rm jipdaum-django || true
            docker run -d --name jipdaum-django \
              --network jipdaum-net \
              -p 127.0.0.1:8000:8000 \
              -v /opt/jipdaum/config/backend.env:/app/.env:ro \
              --restart unless-stopped \
              mingeon9411/jipdaum-django:latest
            docker image prune -f
