name: Build and Deploy (Django)

# 프론트(frontend/)는 더 이상 이 워크플로우가 안 건드림 — Cloudflare Pages가
# 대시보드에서 이 저장소를 직접 연동해 push마다 자체적으로 빌드/배포한다
# (Root directory: frontend, Build command: npm run build, Output: dist).
# 예전엔 여기서 빌드해 EC2 nginx(/var/www/jipdaum)로 SCP했었는데, 그 job은 삭제됨.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-django:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mingeon9411
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            mingeon9411/jipdaum-django:latest
            mingeon9411/jipdaum-django:${{ github.sha }}
          cache-from: type=gha,scope=django
          cache-to: type=gha,mode=max,scope=django

  deploy-django:
    needs: build-django
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull mingeon9411/jipdaum-django:latest
            docker stop jipdaum-django || true
            docker rm jipdaum-django || true
            docker run -d --name jipdaum-django \
              --network jipdaum-net \
              -p 127.0.0.1:8000:8000 \
              -v /opt/jipdaum/config/backend.env:/app/.env:ro \
              --restart unless-stopped \
              mingeon9411/jipdaum-django:latest
            docker image prune -f
