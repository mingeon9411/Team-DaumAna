<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-jd.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>집다움 :: "Home, Made Yours"</title>
    <meta name="description" content="집다움 :: 나다움의 집" />
    <!-- 로그인/회원가입 모달은 열리는 순간에야 hCaptcha 스크립트를 요청하는데,
         그 시점에 DNS/TLS 연결까지 새로 맺다 보니 체감 지연이 컸다.
         페이지 로드 시 미리 연결을 예열해두면 실제 클릭 시엔 스크립트 바이트만 받으면 된다. -->
    <link rel="preconnect" href="https://js.hcaptcha.com" crossorigin />
    <link rel="preconnect" href="https://newassets.hcaptcha.com" crossorigin />
    <link rel="dns-prefetch" href="https://js.hcaptcha.com" />
    <link rel="dns-prefetch" href="https://newassets.hcaptcha.com" />

    <!-- 구글 폰트를 index.css의 @import로 불러오면 브라우저가 그 CSS 파일을 다
         파싱한 후에야 폰트 stylesheet 요청을 시작해 한 박자 늦게 발견된다.
         head에서 바로 링크로 걸어 HTML 파싱과 동시에 요청이 나가게 한다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500&family=Song+Myung&family=DM+Mono:wght@400;500&family=Alex+Brush&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
